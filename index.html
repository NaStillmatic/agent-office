<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Office</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }
      /* 화면 언어(<html lang>)별로 그 언어 글꼴을 앞에 둔다. 같은 한자라도 일본어·중국어 글꼴의 모양이 달라서다 */
      body {
        background: #e8eceb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic',
          'Hiragino Sans', 'Yu Gothic UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK KR', sans-serif;
      }
      html:lang(ko) body {
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic',
          'Noto Sans CJK KR', sans-serif;
      }
      html:lang(ja) body {
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Segoe UI',
          'Yu Gothic UI', 'Meiryo', 'Noto Sans CJK JP', sans-serif;
      }
      html:lang(zh) body {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', 'Microsoft YaHei',
          'Noto Sans CJK SC', sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
